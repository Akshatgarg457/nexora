# =====================================================================
# Automated test configuration — isolated in-memory H2.
#
# Every value below is a hard literal, NOT an environment-variable
# placeholder, so no exported DB_URL / DB_USERNAME / DB_PASSWORD can
# redirect the suite at a developer's MySQL instance. Verified: with all
# three exported the tests still bind jdbc:h2:mem:nexora_test_db and no
# MySQL traffic is attempted.
#
# Literals alone do NOT protect the nexora.* keys. OS environment variables
# outrank profile-specific properties on the classpath, so an exported
# NEXORA_BOOTSTRAP_ENABLED=false overrides this file and fails
# BootstrapAdminTest. Both @SpringBootTest classes therefore also carry
# @TestPropertySource(locations = "classpath:application-test.properties"),
# which Spring adds ABOVE the environment. Do not remove those annotations.
#
# Database name is "nexora_test_db" - distinct from the "nexoradb" used by
# the opt-in h2 dev profile - so the two can never share state.
#
# @ActiveProfiles("test") on the test classes wins over any ambient
# SPRING_PROFILES_ACTIVE value (verified).
# =====================================================================
spring.datasource.url=jdbc:h2:mem:nexora_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.pool-name=NexoraTestPool

# No explicit dialect: Hibernate detects H2Dialect from the JDBC metadata.
# Setting it manually only produced warning HHH90000025.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Fixed test fixtures. These are not production credentials and must never
# be replaced with real values.
nexora.bootstrap.admin.email=admin@nexora.com
nexora.bootstrap.admin.password=Admin@Nexora2026!
nexora.bootstrap.admin.name=Nexora System Admin
nexora.bootstrap.enabled=true

nexora.jwt.secret=NexoraSakuraSecretKeyForJwtAuthenticationAndAuthorization2026!Key
nexora.jwt.expiration-ms=86400000
