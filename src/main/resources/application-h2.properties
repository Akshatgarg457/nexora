# =====================================================================
# Opt-in in-memory H2 profile for running the app WITHOUT MySQL.
#
#     Windows PowerShell:  $env:SPRING_PROFILES_ACTIVE="h2"; .\mvnw.cmd spring-boot:run
#     Git Bash / Linux:    SPRING_PROFILES_ACTIVE=h2 ./mvnw spring-boot:run
#     Packaged jar:        java -jar target\nexora-backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=h2
#
# Data lives only in memory and is discarded on shutdown. This profile is
# for UI work and quick smoke tests. Use the default (MySQL) configuration
# whenever persistence matters.
#
# Automated tests do NOT use this profile - they use "test"
# (src/test/resources/application-test.properties), which is a separate
# database name so the two can never collide.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:nexoradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.hikari.pool-name=NexoraH2Pool

spring.jpa.hibernate.ddl-auto=update

# H2 console is only meaningful here, so it is enabled only in this profile.
# NOTE: SecurityConfig still permits /h2-console/** unconditionally; that
# rule belongs to the separate security-hardening task and is untouched here.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
