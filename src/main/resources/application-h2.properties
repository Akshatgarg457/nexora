# =====================================================================
# Opt-in in-memory H2 profile for running the app WITHOUT MySQL.
#
#     Windows PowerShell:  $env:SPRING_PROFILES_ACTIVE="h2"; .\mvnw.cmd spring-boot:run
#     Git Bash / Linux:    SPRING_PROFILES_ACTIVE=h2 ./mvnw spring-boot:run
#     Packaged jar:        java -jar target\nexora-backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=h2
#
# Data lives only in memory and is discarded on shutdown. This profile is
# for UI work and quick smoke tests. Use the default (MySQL) configuration
# whenever persistence matters.
#
# Automated tests do NOT use this profile - they use "test"
# (src/test/resources/application-test.properties), which is a separate
# database name so the two can never collide.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:nexoradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.hikari.pool-name=NexoraH2Pool

spring.jpa.hibernate.ddl-auto=update

# H2 console settings live only in this profile and can never leak into the
# default MySQL profile.
#
# NOTE: they are currently INERT. Spring Boot 4 moved the H2 console into its
# own module (spring-boot-h2console), which this project does not depend on -
# no console auto-configuration is packaged, so no servlet is registered and
# /h2-console answers 404, which surfaces as a 403 through /error.
#
# Adding that dependency would activate these settings. That is a deliberate
# decision rather than a default, because SecurityConfig still permits
# /h2-console/** unconditionally and a live browser SQL console behind
# permitAll is a serious exposure. That rule belongs to the separate
# security-hardening task and is untouched here.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
