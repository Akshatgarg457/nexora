spring.application.name=nexora-backend
server.port=8080

# Database Configuration (Defaults to in-memory H2 dev fallback; overrides automatically when DB_URL & DB_PASSWORD are set for MySQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:nexoradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Console (for dev inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Bootstrap Admin Configuration
nexora.bootstrap.admin.email=${NEXORA_BOOTSTRAP_ADMIN_EMAIL:admin@nexora.com}
nexora.bootstrap.admin.password=${NEXORA_BOOTSTRAP_ADMIN_PASSWORD:Admin@Nexora2026!}
nexora.bootstrap.admin.name=${NEXORA_BOOTSTRAP_ADMIN_NAME:Nexora System Admin}
nexora.bootstrap.enabled=${NEXORA_BOOTSTRAP_ENABLED:true}

# JWT Configuration
nexora.jwt.secret=${NEXORA_JWT_SECRET:NexoraSakuraSecretKeyForJwtAuthenticationAndAuthorization2026!Key}
nexora.jwt.expiration-ms=${NEXORA_JWT_EXPIRATION_MS:86400000}

# Logging Configuration
logging.level.com.nexora.backend=INFO
logging.level.org.springframework.security=INFO
