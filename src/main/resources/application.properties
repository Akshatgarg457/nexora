spring.application.name=nexora-backend
server.port=${SERVER_PORT:8080}

# =====================================================================
# Datasource — MySQL is the persistent database for normal local runs.
#
# DB_URL and DB_DRIVER default to a local MySQL "nexora" schema. DB_USERNAME
# and DB_PASSWORD have NO fallback and must be supplied by the environment.
# There is deliberately no in-memory H2 default here: a missing credential set
# stops startup rather than silently discarding every write on shutdown.
# DataSourceConfigValidator (registered in META-INF/spring.factories) turns
# that case into a readable message instead of a Hibernate dialect error.
#
# To run without MySQL, activate the opt-in H2 profile:
#     SPRING_PROFILES_ACTIVE=h2
# Automated tests use the "test" profile (src/test/resources).
#
# Spring Boot does NOT read .env automatically; export the variables into the
# shell before starting. Copy .env.example to .env for the full list.
# Never commit .env.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexora?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ---------------------------------------------------------------------
# HikariCP connection pool
# initialization-fail-timeout stays at its default (1ms) so an unreachable
# or misconfigured database fails during startup instead of on first query.
# No connection-test-query: MySQL Connector/J is a JDBC4 driver and HikariCP
# uses Connection.isValid() instead, which is cheaper.
# ---------------------------------------------------------------------
spring.datasource.hikari.pool-name=NexoraHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}

# ---------------------------------------------------------------------
# JPA / Hibernate
# No explicit dialect: Hibernate 7 detects MySQLDialect from the JDBC
# metadata. ddl-auto stays "update" to preserve current behaviour; it is
# overridable so it can be switched to "validate" once Flyway owns the
# schema.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Bootstrap Admin Configuration
nexora.bootstrap.admin.email=${NEXORA_BOOTSTRAP_ADMIN_EMAIL:admin@nexora.com}
nexora.bootstrap.admin.password=${NEXORA_BOOTSTRAP_ADMIN_PASSWORD:Admin@Nexora2026!}
nexora.bootstrap.admin.name=${NEXORA_BOOTSTRAP_ADMIN_NAME:Nexora System Admin}
nexora.bootstrap.enabled=${NEXORA_BOOTSTRAP_ENABLED:true}

# JWT Configuration
nexora.jwt.secret=${NEXORA_JWT_SECRET:NexoraSakuraSecretKeyForJwtAuthenticationAndAuthorization2026!Key}
nexora.jwt.expiration-ms=${NEXORA_JWT_EXPIRATION_MS:86400000}

# Logging Configuration
logging.level.com.nexora.backend=INFO
logging.level.org.springframework.security=INFO
